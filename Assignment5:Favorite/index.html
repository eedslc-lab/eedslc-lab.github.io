<!DOCTYPE html>
<html>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="main.css"/>
    <head>
        <title>Home</title>
    </head>
    <body >
        <div id="fixed-menu" data-theme="earthy">
            <div id="navigation-container">
                <div class="navigation" id="navigation-home" >Home</div>
                <div id="navigation-header">Home Page</div>
                <div class="navigation" id="navigation-gallery"><a href="gallery.html" id="gallery-anchor">Gallery</a></div>    
            </div>
            <div id="themes-container">
                <div class="themes">
                    <label><input type="radio" name="theme-button" id="classy-theme" checked></input>Classy </label>
                </div>
                <div class="themes">
                    <label><input type="radio" name="theme-button" id="earthy-theme"></input>Earthy </label>
                </div>
                <div class="themes">
                    <label><input type="radio" name="theme-button" id="punk-theme"></input>Punk </label>
                </div>
            </div>
        </div>
        <div id="image-selection-container" >
            <div id="image-selection-title-container">
                <div id="image-selection-title">Image Selection</div>
            </div>
            <div id="image-generation-container">
                <div id="image-favorite-generation-container">
                    <input type="button" id="generate-image" value="Generate">
                    <input type="button" id="favorite-image" value="Favorite">
                </div>
                <div id="image-selection-input-container">
                    <div class="image-selection" id="cat-images"><input type="radio" name="image-button" id="cat-button">
                        <label for="cat-button">Cat</label>
                    </div>
                    <div class="image-selection" id="dog-images"><input type="radio" name="image-button" id="dog-button">
                        <label for="dog-button">Dog</label>
                    </div>
                    <div class="image-selection" id="fox-images"><input type="radio" name="image-button" id="fox-button" checked>
                        <label for="fox-button">Fox</label>
                    </div>
                </div>
            </div>
        </div>
        <div id="image-paper-container">
            <div id="image-paper">
                <div id="image-api"></div>
                <img id="image"/>
                <div id="image-url"></div>
            </div>
        </div>
    </body>
</html>
