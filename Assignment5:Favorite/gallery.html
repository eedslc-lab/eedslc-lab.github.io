<!DOCTYPE html>
<html>
    <script src="gallery.js" defer></script>
    <link rel="stylesheet" href="gallery.css"/>
    <head>
        <title>Gallery</title>
    </head>
    <body>
        <div id="fixed-menu">
            <div id="navigation-container">
                <div class="navigation" id="navigation-home">Home</div>
                <div id="navigation-header">Gallery Page</div>
                <div class="navigation" id="navigation-gallery">Gallery</div>
            </div>
            <div id="themes-container">
                <div class="themes">
                    <label><input type="radio" name="theme-button" id="classy-theme"></input>Classy </label>
                </div>
                <div class="themes">
                    <label><input type="radio" name="theme-button" id="earthy-theme"></input>Earthy </label>
                </div>
                <div class="themes">
                    <label><input type="radio" name="theme-button" id="punk-theme"></input>Punk </label>
                </div>
            </div>
            <div id="filter-container">
                <div class="filter-selection" id="cat-filter"><input type="checkbox" name="filter-button" id="cat-button">
                    <label for="cat-button">Cat</label>
                </div>
                <div class="filter-selection" id="dog-filter"><input type="checkbox" name="filter-button" id="dog-button">
                    <label for="dog-button">Dog</label>
                </div>
                <div class="filter-selection" id="fox-filter"><input type="checkbox" name="filter-button" id="fox-button">
                    <label for="fox-button">Fox</label>
                </div>
            </div>
        </div>
        <div id="image-gallery-paper-container">
            <div id="image-gallery">
                
            </div>
        </div>
    </body>
</html>
